name: Publish to PPA

on:
  push:
    branches: [main]
    paths:
      - 'debian/**'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts dpkg-dev dput

      - name: Build package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign changes
        run: |
          gpg --clearsign -o *.changes *.changes
          gpg --detach-sign -o *.dsc *.dsc

      - name: Create dput config
        run: |
          cat > ~/.dput.cf <<EOF
          [ppa:ken-vandine/gaming]
          method = ftp
          incoming = incoming
          login = ${{ secrets.LAUNCHPAD_USERNAME }}
          password = ${{ secrets.DPUT_KEY }}
          EOF

      - name: Upload to PPA
        run: |
          dput ppa:ken-vandine/gaming *.changes

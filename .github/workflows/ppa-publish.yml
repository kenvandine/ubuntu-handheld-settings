name: Publish to PPA

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Upload revision number'
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEBEMAIL: ken.vandine@canonical.com
      EDITOR: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper equivs dput

      - name: Install build dependencies
        run: |
          sudo mk-build-deps --install --remove \
            --tool="apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends --yes" \
            debian/control

      - name: Import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify GPG key
        run: |
          echo "Imported key: ${{ steps.gpg.outputs.keyid }}"
          gpg --list-secret-keys --keyid-format long

      - name: Configure dput
        run: |
          cat > ~/.dput.cf <<EOF
          [ken-vandine-gaming]
          fqdn = upload.ppa.launchpad.net
          method = ftp
          incoming = ~ken-vandine/ubuntu/gaming/
          login = anonymous
          allow_unsigned_uploads = 0
          passive_ftp = True
          EOF

      - name: Build and upload
        env:
          KEYID: ${{ steps.gpg.outputs.keyid }}
          REVISION: ${{ github.event.inputs.revision || '1' }}
        run: |
          base_version=$(dpkg-parsechangelog -S Version)
          dch --newversion "${base_version}+${REVISION}" \
            --distribution UNRELEASED --force-distribution \
            -m "Publish to ken-vandine/gaming PPA."

          debuild -S -k"$KEYID"

          # Debug: check signatures
          echo "=== .changes file ==="
          head -5 ../*_source.changes
          echo ""
          echo "=== gpg verify ==="
          gpg --verify ../*_source.changes 2>&1 || true

          dput ken-vandine-gaming ../*_source.changes
